        "404":
          $ref: "#/components/responses/AgentError"

  /v2/game:
    get:
      operationId: getGameV2
      tags: [agent]
      summary: Return complete known information for one canonical NFL game
      parameters:
        - name: game_id
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AgentSeason"
        - $ref: "#/components/parameters/AgentCalcuttaId"
        - $ref: "#/components/parameters/AgentPeriod"
        - $ref: "#/components/parameters/AgentBasis"
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGameDetail"
        "400":
