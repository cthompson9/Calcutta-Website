openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Auction Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: teams
  - name: bidders
  - name: seasons
  - name: results
  - name: trades
  - name: mtm
  - name: summary
  - name: auction

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /seasons:
    get:
      operationId: getSeasons
      tags: [seasons]
      summary: List all seasons
      responses:
        "200":
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
    post:
      operationId: createSeason
      tags: [seasons]
      summary: Create a season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "201":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: division
          in: query
          schema:
            type: string
            enum: [East, North, South, West]
        - name: search
          in: query
          schema:
            type: string
        - name: bidderId
          in: query
          schema:
            type: ["number", "null"]
        - name: season
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a single team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bidders:
    get:
      operationId: getBidders
      tags: [bidders]
      summary: List bidders. With season, returns only season participants (primary owners + approved trade recipients). Without season, returns all bidders (global identity directory).
      parameters:
        - name: season
          in: query
          schema:
            type: ["number", "null"]
          description: When supplied, filter to bidders with a season presence (team_bidders owners + approved trade toBidders). Without season, returns all bidders for global identity directory use.
      responses:
        "200":
          description: List of bidders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidderSummary"
    post:
      operationId: createBidder
      tags: [bidders]
      summary: Create a bidder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderInput"
      responses:
        "201":
          description: Created bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bidders/{id}:
    patch:
      operationId: updateBidder
      tags: [bidders]
      summary: Update a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderUpdate"
      responses:
        "200":
          description: Updated bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBidder
      tags: [bidders]
      summary: Delete a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results:
    get:
      operationId: getResults
      tags: [results]
      summary: Calcutta Returns by team for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of team results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamResultRow"

  /results/by-owner:
    get:
      operationId: getResultsByOwner
      tags: [results]
      summary: Calcutta Returns aggregated by owner for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Owner-level result summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerResultRow"

  /results/upsert:
    post:
      operationId: upsertTeamResult
      tags: [results]
      summary: Create or update a team result record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamResultInput"
      responses:
        "200":
          description: Upserted team result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResultRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List trades for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRow"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Record a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/{id}:
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a pending trade record (price, date, notes; percentage edits require ADMIN_API_KEY)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: ADMIN_API_KEY bearer token required when changing ownership percentage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Approved trades are immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a pending or rejected trade record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Approved trades cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/{id}/status:
    patch:
      operationId: setTradeStatus
      tags: [trades]
      summary: Approve or reject a trade (admin only — requires ADMIN_API_KEY bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeStatusUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mtm:
    get:
      operationId: getMtmSnapshots
      tags: [mtm]
      summary: Get weekly MTM snapshots for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: teamId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: MTM snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmData"
    post:
      operationId: upsertMtmSnapshot
      tags: [mtm]
      summary: Add or update a weekly MTM snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MtmSnapshotInput"
      responses:
        "200":
          description: Upserted snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmSnapshot"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target team/date is protected Kalshi Week 0 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mtm/week-zero/capture:
    post:
      operationId: captureWeekZeroMtm
      tags: [mtm]
      summary: Capture an admin-authorized Week 0 valuation from public Kalshi market data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekZeroCaptureInput"
      responses:
        "200":
          description: Captured Week 0 valuation diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekZeroCaptureResult"
        "400":
          description: Validation or incomplete market data error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The selected Week 0 date is already occupied by manual MTM data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Kalshi market data could not be captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary:
    get:
      operationId: getAuctionSummary
      tags: [summary]
      summary: Overall auction summary for a specific season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
          description: Season year (YYYY). Required. Returns empty/zero data if the season has no auction rows.
      responses:
        "200":
          description: Auction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auction/import:
    post:
      operationId: importAuctionData
      tags: [auction]
      summary: Import a complete season auction export from the configured AuctionPro source
      description: Requires the ADMIN_API_KEY bearer token. The source URL and optional source authorization stay server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionImportInput"
      responses:
        "200":
          description: Imported selected season auction data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionImportResult"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing approved trades make it unsafe to replace primary ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Source export is malformed, incomplete, or cannot be resolved safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Configured AuctionPro source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auction/import/draft-order:
    post:
      operationId: importDraftOrder
      tags: [auction]
      summary: Import auction prices, ownership, and draft order from the AuctionPro live endpoint
      description: >
        Fetches the public AuctionPro draft-order endpoint and atomically replaces the
        season's auction prices, single-owner primary ownership, and draft order in
        team results. Requires the ADMIN_API_KEY bearer token. Blocked if any of the
        32 teams already have approved trades for the target season.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionImportInput"
      responses:
        "200":
          description: Successfully imported draft-order data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionImportResult"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing approved trades make it unsafe to replace primary ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Source export is malformed, incomplete, or cannot be resolved safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AuctionPro draft-order endpoint is unavailable or returned a non-JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Season:
      type: object
      properties:
        id:
          type: number
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [id, year, isActive, isComplete, label]

    SeasonInput:
      type: object
      properties:
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [year, label]

    Bidder:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
      required: [id, name]

    BidderSummary:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        teamCount:
          type: number
        totalPaid:
          type: number
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamRef"
      required: [id, name, teamCount, totalPaid, teams]

    TeamRef:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
        division:
          type: string
        bidAmount:
          type: number
        ownershipShare:
          type: number
      required: [id, name, conference, division, bidAmount, ownershipShare]

    BidderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]

    BidderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    Team:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/TeamOwner"
      required: [id, name, conference, division, bidAmount, owners]

    TeamOwner:
      type: object
      properties:
        bidderId:
          type: number
        bidderName:
          type: string
        ownershipShare:
          type: number
      required: [bidderId, bidderName, ownershipShare]

    TeamInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
          minimum: 0
        season:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerInput"
          minItems: 1
      required: [name, conference, division, bidAmount, owners]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
          minimum: 0
        season:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerInput"
          minItems: 1

    OwnerInput:
      type: object
      properties:
        bidderId:
          type: number
        ownershipShare:
          type: number
      required: [bidderId, ownershipShare]

    # Results (Calcutta Returns format)
    TeamResultRow:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        conference:
          type: string
        division:
          type: string
        owners:
          type: array
          items:
            $ref: "#/components/schemas/TeamOwner"
        cost:
          type: number
        wins:
          type: number
        losses:
          type: number
        ties:
          type: number
        ptDiff:
          type: number
        startingPoints:
          type: number
        draftOrder:
          type: ["number", "null"]
        playoffBerth:
          type: boolean
        divRound:
          type: boolean
        confRound:
          type: boolean
        sbBerth:
          type: boolean
        winSuperBowl:
          type: boolean
        realizedReturn:
          type: number
        realizedMultiple:
          type: number
        netReturn:
          type: number
        netPctReturn:
          type: number
        markToMarket:
          type: number
        seed:
          type: ["number", "null"]
          description: "Playoff seed within conference (1–7). Null if team missed playoffs or seed not yet set."
      required:
        - teamId
        - teamName
        - conference
        - division
        - owners
        - cost
        - wins
        - losses
        - ties
        - ptDiff
        - startingPoints
        - playoffBerth
        - divRound
        - confRound
        - sbBerth
        - winSuperBowl
        - realizedReturn
        - realizedMultiple
        - netReturn
        - netPctReturn
        - markToMarket

    OwnerResultRow:
      type: object
      properties:
        bidderId:
          type: number
        bidderName:
          type: string
        teamCount:
          type: number
        totalCost:
          type: number
        totalRealizedReturn:
          type: number
        totalNetReturn:
          type: number
        netPctReturn:
          type: number
        totalMtm:
          type: number
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamResultRow"
      required:
        - bidderId
        - bidderName
        - teamCount
        - totalCost
        - totalRealizedReturn
        - totalNetReturn
        - netPctReturn
        - totalMtm
        - teams

    TeamResultInput:
      type: object
      properties:
        teamId:
          type: number
        seasonYear:
          type: number
        wins:
          type: number
          minimum: 0
        losses:
          type: number
          minimum: 0
        ties:
          type: number
          minimum: 0
        ptDiff:
          type: number
        startingPoints:
          type: number
        draftOrder:
          type: ["number", "null"]
        playoffBerth:
          type: boolean
        divRound:
          type: boolean
        confRound:
          type: boolean
        sbBerth:
          type: boolean
        winSuperBowl:
          type: boolean
        realizedReturn:
          type: number
        realizedMultiple:
          type: number
        netReturn:
          type: number
        netPctReturn:
          type: number
        markToMarket:
          type: number
      required: [teamId, seasonYear]

    # Trades
    TradeRow:
      type: object
      properties:
        id:
          type: number
        seasonYear:
          type: number
        teamId:
          type: number
        teamName:
          type: string
        fromBidderId:
          type: number
        fromBidderName:
          type: string
        toBidderId:
          type: number
        toBidderName:
          type: string
        price:
          type: number
        percentage:
          type: number
          description: Percentage of team traded (0–100). Default 100 = full transfer.
        status:
          type: string
          enum: [pending, approved, rejected]
          description: Approval status. New trades start as pending.
        tradeDate:
          type: string
        notes:
          type: ["string", "null"]
      required:
        - id
        - seasonYear
        - teamId
        - teamName
        - fromBidderId
        - fromBidderName
        - toBidderId
        - toBidderName
        - price
        - percentage
        - status
        - tradeDate

    TradeInput:
      type: object
      properties:
        seasonYear:
          type: number
        teamId:
          type: number
        fromBidderId:
          type: number
        toBidderId:
          type: number
        price:
          type: number
          description: Trade price. If omitted, defaults to the team's original draft cost × percentage / 100.
        percentage:
          type: number
          description: Percentage of team traded (0–100). Defaults to 100.
        tradeDate:
          type: string
        notes:
          type: string
      required: [seasonYear, teamId, fromBidderId, toBidderId, tradeDate]

    TradeUpdate:
      type: object
      properties:
        price:
          type: number
        percentage:
          type: number
        tradeDate:
          type: string
        notes:
          type: string

    TradeStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
      required: [status]

    # MTM
    MtmSnapshot:
      type: object
      properties:
        id:
          type: number
        teamId:
          type: number
        seasonId:
          type: number
        weekNum:
          type: ["number", "null"]
        snapshotDate:
          type: string
        mtmValue:
          type: number
        snapshotKey:
          type: ["string", "null"]
        source:
          type: string
        capturedAt:
          type: ["string", "null"]
        marketStatus:
          type: ["string", "null"]
          enum: [live, stale, incomplete, manual, null]
        bankedPoints:
          type: ["number", "null"]
        seasonEquityPoints:
          type: ["number", "null"]
        bonusEquityPoints:
          type: ["number", "null"]
        totalPoints:
          type: ["number", "null"]
        normalizedShare:
          type: ["number", "null"]
      required: [id, teamId, seasonId, snapshotDate, mtmValue]

    MtmWeekData:
      type: object
      properties:
        snapshotDate:
          type: string
        weekNum:
          type: ["number", "null"]
        label:
          type: string
        source:
          type: string
        capturedAt:
          type: ["string", "null"]
        potSize:
          type: number
        rawPointTotal:
          type: number
        normalizedShareTotal:
          type: number
        marketStatusCounts:
          $ref: "#/components/schemas/MtmMarketStatusCounts"
        ownerTotals:
          type: array
          items:
            $ref: "#/components/schemas/MtmOwnerWeek"
        teamValues:
          type: array
          items:
            $ref: "#/components/schemas/MtmTeamWeek"
      required:
        [
          snapshotDate,
          label,
          source,
          potSize,
          rawPointTotal,
          normalizedShareTotal,
          marketStatusCounts,
          ownerTotals,
          teamValues,
        ]

    MtmMarketStatusCounts:
      type: object
      properties:
        live:
          type: number
        stale:
          type: number
        incomplete:
          type: number
        manual:
          type: number
      required: [live, stale, incomplete, manual]

    MtmOwnerWeek:
      type: object
      properties:
        bidderName:
          type: string
        mtmTotal:
          type: number
      required: [bidderName, mtmTotal]

    MtmTeamWeek:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        ownerName:
          type: string
        mtmValue:
          type: number
        source:
          type: string
        capturedAt:
          type: ["string", "null"]
        marketStatus:
          type: string
          enum: [live, stale, incomplete, manual]
        contractSetId:
          type: ["string", "null"]
        marketStatusReasons:
          type: array
          items:
            type: string
        bankedPoints:
          type: ["number", "null"]
        seasonEquityPoints:
          type: ["number", "null"]
        bonusEquityPoints:
          type: ["number", "null"]
        totalPoints:
          type: ["number", "null"]
        normalizedShare:
          type: ["number", "null"]
        winTotalLine:
          type: ["number", "null"]
        winTotalOverProbability:
          type: ["number", "null"]
        rawExpectedWins:
          type: ["number", "null"]
        expectedWins:
          type: ["number", "null"]
        playoffProbability:
          type: ["number", "null"]
        divisionalProbability:
          type: ["number", "null"]
        conferenceGameProbability:
          type: ["number", "null"]
        superBowlProbability:
          type: ["number", "null"]
        championshipProbability:
          type: ["number", "null"]
        regularSeasonMethod:
          type: ["string", "null"]
        intermediateRoundMethod:
          type: ["string", "null"]
        marketQuotes:
          type: array
          items:
            $ref: "#/components/schemas/MtmMarketQuote"
      required:
        [
          teamId,
          teamName,
          ownerName,
          mtmValue,
          source,
          marketStatus,
          marketStatusReasons,
          marketQuotes,
        ]

    MtmMarketQuote:
      type: object
      properties:
        ticker:
          type: string
        kind:
          type: string
          enum: [win_threshold, playoff, conference_champion, championship]
        line:
          type: ["number", "null"]
        bid:
          type: ["number", "null"]
        ask:
          type: ["number", "null"]
        last:
          type: ["number", "null"]
        probability:
          type: ["number", "null"]
        spread:
          type: ["number", "null"]
        bidDepth:
          type: ["number", "null"]
        askDepth:
          type: ["number", "null"]
        quality:
          type: string
          enum: [live, stale, unavailable]
        updatedAt:
          type: ["string", "null"]
        derived:
          type: boolean
      required:
        [
          ticker,
          kind,
          line,
          bid,
          ask,
          last,
          probability,
          spread,
          bidDepth,
          askDepth,
          quality,
          updatedAt,
          derived,
        ]

    MtmData:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/MtmWeekData"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/MtmTeamSeries"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/MtmOwnerSeries"
      required: [weeks, teams, owners]

    MtmTeamSeries:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        conference:
          type: string
        ownerName:
          type: string
        weeklyValues:
          type: array
          items:
            type: number
      required: [teamId, teamName, conference, ownerName, weeklyValues]

    MtmOwnerSeries:
      type: object
      properties:
        bidderName:
          type: string
        weeklyTotals:
          type: array
          items:
            type: number
      required: [bidderName, weeklyTotals]

    MtmSnapshotInput:
      type: object
      properties:
        teamId:
          type: number
        seasonYear:
          type: number
        weekNum:
          type: number
          description: Optional week label (0=pre-season, 1–18=regular, 19+=playoffs)
        snapshotDate:
          type: string
          description: "Date as YYYY-MM-DD. Defaults to today. Same-day submissions overwrite the previous value."
        mtmValue:
          type: number
      required: [teamId, seasonYear, mtmValue]

    WeekZeroCaptureInput:
      type: object
      properties:
        seasonYear:
          type: number
        snapshotDate:
          type: string
          description: Optional Week 0 calendar date as YYYY-MM-DD. The first successful capture fixes this date for idempotent retries.
      required: [seasonYear]

    WeekZeroCaptureResult:
      type: object
      properties:
        seasonYear:
          type: number
        snapshotDate:
          type: string
        capturedAt:
          type: string
        teamCount:
          type: number
        contractSetId:
          type: string
        potSize:
          type: number
        rawPointTotal:
          type: number
        normalizedShareTotal:
          type: number
        marketStatusCounts:
          $ref: "#/components/schemas/MtmMarketStatusCounts"
      required:
        [
          seasonYear,
          snapshotDate,
          capturedAt,
          teamCount,
          contractSetId,
          potSize,
          rawPointTotal,
          normalizedShareTotal,
          marketStatusCounts,
        ]

    # Summary
    AuctionSummary:
      type: object
      properties:
        potSize:
          type: number
        teamsAuctioned:
          type: number
        avgBidPerTeam:
          type: number
        mostExpensiveTeam:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MostExpensiveTeam"
        auctionResults:
          type: array
          items:
            $ref: "#/components/schemas/AuctionResult"
        conferenceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ConferenceBreakdown"
      required:
        - potSize
        - teamsAuctioned
        - avgBidPerTeam
        - mostExpensiveTeam
        - auctionResults
        - conferenceBreakdown

    MostExpensiveTeam:
      type: object
      properties:
        name:
          type: string
        bidAmount:
          type: number
      required: [name, bidAmount]

    AuctionResult:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        winnerName:
          type: string
        bidAmount:
          type: number
        draftOrder:
          type: number
          nullable: true
      required: [teamId, teamName, winnerName, bidAmount, draftOrder]

    ConferenceBreakdown:
      type: object
      properties:
        conference:
          type: string
        totalSpent:
          type: number
        teamCount:
          type: number
        avgBid:
          type: number
      required: [conference, totalSpent, teamCount, avgBid]

    AuctionImportInput:
      type: object
      properties:
        seasonYear:
          type: number
          description: Season year to replace from the configured complete AuctionPro export.
      required: [seasonYear]

    AuctionImportResult:
      type: object
      properties:
        seasonYear:
          type: number
        importedTeams:
          type: number
        importedOwners:
          type: number
        source:
          type: string
      required: [seasonYear, importedTeams, importedOwners, source]
