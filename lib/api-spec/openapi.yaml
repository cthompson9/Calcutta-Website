          type: number
        teamId:
          type: number
        fromBidderId:
          type: number
        toBidderId:
          type: number
        price:
          type: number
          description: Trade price. If omitted, defaults to the team's original draft cost × percentage / 100.
        percentage:
          type: number
          description: Percentage of team traded (0–100). Defaults to 100.
        tradeDate:
          type: string
        notes:
          type: string
          maxLength: 2000
      required: [seasonYear, teamId, fromBidderId, toBidderId, tradeDate]

    TradeUpdate:
      type: object
