        bankedPoints:
          type: ["number", "null"]
        seasonEquityPoints:
          type: ["number", "null"]
        bonusEquityPoints:
          type: ["number", "null"]
        totalPoints:
          type: ["number", "null"]
        normalizedShare:
          type: ["number", "null"]
        winTotalLine:
          type: ["number", "null"]
        winTotalOverProbability:
          type: ["number", "null"]
        rawExpectedWins:
          type: ["number", "null"]
        expectedWins:
          type: ["number", "null"]
        playoffProbability:
          type: ["number", "null"]
        divisionalProbability:
          type: ["number", "null"]
        conferenceGameProbability:
          type: ["number", "null"]
        superBowlProbability:
          type: ["number", "null"]
        championshipProbability:
          type: ["number", "null"]
        regularSeasonMethod:
          type: ["string", "null"]
        intermediateRoundMethod:
          type: ["string", "null"]
        marketQuotes:
          type: array
          items:
            $ref: "#/components/schemas/MtmMarketQuote"
      required:
        [
          teamId,
          teamName,
          ownerName,
          mtmValue,
          source,
          marketStatus,
          marketStatusReasons,
          marketQuotes,
        ]

    MtmMarketQuote:
      type: object
      properties:
        ticker:
          type: string
        kind:
          type: string
          enum: [win_threshold, playoff, conference_champion, championship]
        line:
          type: ["number", "null"]
        bid:
          type: ["number", "null"]
        ask:
          type: ["number", "null"]
        last:
          type: ["number", "null"]
        probability:
          type: ["number", "null"]
        spread:
          type: ["number", "null"]
        bidDepth:
          type: ["number", "null"]
        askDepth:
          type: ["number", "null"]
        quality:
          type: string
          enum: [live, stale, unavailable]
        updatedAt:
          type: ["string", "null"]
        derived:
          type: boolean
      required:
        [
          ticker,
          kind,
          line,
          bid,
          ask,
          last,
          probability,
          spread,
          bidDepth,
          askDepth,
          quality,
          updatedAt,
          derived,
        ]

    MtmData:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/MtmWeekData"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/MtmTeamSeries"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/MtmOwnerSeries"
      required: [weeks, teams, owners]

    MtmTeamSeries:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        conference:
          type: string
        ownerName:
          type: string
        weeklyValues:
          type: array
          items:
            type: number
      required: [teamId, teamName, conference, ownerName, weeklyValues]

    MtmOwnerSeries:
      type: object
      properties:
        bidderName:
          type: string
        weeklyTotals:
          type: array
          items:
            type: number
      required: [bidderName, weeklyTotals]

    MtmSnapshotInput:
      type: object
      properties:
        teamId:
          type: number
        seasonYear:
          type: number
        calcuttaId:
          type: number
        weekNum:
          type: number
          description: Optional week label (0=pre-season, 1–18=regular, 19+=playoffs)
        snapshotDate:
          type: string
          description: "Date as YYYY-MM-DD. Defaults to today. Same-day submissions overwrite the previous value."
        mtmValue:
          type: number
      required: [teamId, seasonYear, mtmValue]

    WeekZeroCaptureInput:
      type: object
      properties:
        seasonYear:
          type: number
        calcuttaId:
          type: number
        snapshotDate:
          type: string
          description: Optional Week 0 calendar date as YYYY-MM-DD. The first successful capture fixes this date for idempotent retries.
      required: [seasonYear]

    WeekZeroCaptureResult:
      type: object
      properties:
        seasonYear:
          type: number
        snapshotDate:
          type: string
        capturedAt:
          type: string
        teamCount:
          type: number
        contractSetId:
          type: string
        potSize:
          type: number
        rawPointTotal:
          type: number
        normalizedShareTotal:
          type: number
        marketStatusCounts:
          $ref: "#/components/schemas/MtmMarketStatusCounts"
      required:
        [
          seasonYear,
          snapshotDate,
          capturedAt,
          teamCount,
          contractSetId,
          potSize,
          rawPointTotal,
          normalizedShareTotal,
          marketStatusCounts,
        ]

    # Summary
    AuctionSummary:
      type: object
      properties:
        potSize:
          type: number
        teamsAuctioned:
          type: number
        avgBidPerTeam:
          type: number
        mostExpensiveTeam:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MostExpensiveTeam"
        auctionResults:
          type: array
          items:
            $ref: "#/components/schemas/AuctionResult"
        conferenceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ConferenceBreakdown"
      required:
        - potSize
        - teamsAuctioned
        - avgBidPerTeam
        - mostExpensiveTeam
        - auctionResults
        - conferenceBreakdown

    MostExpensiveTeam:
      type: object
      properties:
        name:
          type: string
        bidAmount:
          type: number
      required: [name, bidAmount]

    AuctionResult:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        winnerName:
          type: string
        bidAmount:
          type: number
        draftOrder:
          type: number
          nullable: true
      required: [teamId, teamName, winnerName, bidAmount, draftOrder]

    ConferenceBreakdown:
      type: object
      properties:
        conference:
          type: string
        totalSpent:
          type: number
        teamCount:
          type: number
        avgBid:
          type: number
      required: [conference, totalSpent, teamCount, avgBid]

    AuctionImportInput:
      type: object
      properties:
        seasonYear:
          type: number
          description: Season year to replace from the configured complete AuctionPro export.
        calcuttaId:
          type: number
      required: [seasonYear]

    AuctionImportResult:
      type: object
      properties:
        seasonYear:
          type: number
        importedTeams:
          type: number
        importedOwners:
          type: number
        source:
          type: string
      required: [seasonYear, importedTeams, importedOwners, source]
