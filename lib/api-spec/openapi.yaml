        "404":
          $ref: "#/components/responses/AgentError"

  /v2/team/schedule:
    get:
      operationId: getTeamScheduleV2
      tags: [agent]
      summary: Return one NFL team's schedule and current Calcutta context
      parameters:
        - $ref: "#/components/parameters/AgentSeason"
        - $ref: "#/components/parameters/AgentCalcuttaId"
        - $ref: "#/components/parameters/AgentTeamRequired"
        - $ref: "#/components/parameters/AgentWeek"
        - $ref: "#/components/parameters/AgentDateFrom"
        - $ref: "#/components/parameters/AgentDateTo"
        - $ref: "#/components/parameters/AgentIncludeMarket"
        - $ref: "#/components/parameters/AgentIncludeProjection"
