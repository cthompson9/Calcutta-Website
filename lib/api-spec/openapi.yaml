openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Auction Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: teams
  - name: bidders
  - name: seasons
  - name: calcuttas
  - name: results
  - name: trades
  - name: mtm
  - name: summary
  - name: auction
  - name: jobs
  - name: agent

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /seasons:
    get:
      operationId: getSeasons
      tags: [seasons]
      summary: List all seasons
      responses:
        "200":
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
    post:
      operationId: createSeason
      tags: [seasons]
      summary: Create a season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "201":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: division
          in: query
          schema:
            type: string
            enum: [East, North, South, West]
        - name: search
          in: query
          schema:
            type: string
        - name: bidderId
          in: query
          schema:
            type: ["number", "null"]
        - name: season
          in: query
          schema:
            type: ["number", "null"]
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
        - name: sport
          in: query
          schema:
            type: string
            enum: [NFL, CFB]
            default: NFL
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a single team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bidders:
    get:
      operationId: getBidders
      tags: [bidders]
      summary: List bidders. With season, returns only season participants (primary owners + approved trade recipients). Without season, returns all bidders (global identity directory).
      parameters:
        - name: season
          in: query
          schema:
            type: ["number", "null"]
          description: When supplied, filter to bidders with a season presence (team_bidders owners + approved trade toBidders). Without season, returns all bidders for global identity directory use.
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
          description: When supplied with season, filter participants to this Calcutta. Omit both filters for the global bidder directory.
      responses:
        "200":
          description: List of bidders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidderSummary"
    post:
      operationId: createBidder
      tags: [bidders]
      summary: Create a bidder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderInput"
      responses:
        "201":
          description: Created bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calcuttas:
    get:
      operationId: getCalcuttas
      tags: [calcuttas]
      summary: List all canonical NFL Calcuttas
      responses:
        "200":
          description: Canonical NFL Calcuttas ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalcuttaOption"

  /bidders/{id}:
    patch:
      operationId: updateBidder
      tags: [bidders]
      summary: Update a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderUpdate"
      responses:
        "200":
          description: Updated bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBidder
      tags: [bidders]
      summary: Delete a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results:
    get:
      operationId: getResults
      tags: [results]
      summary: Calcutta Returns by team for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
        - name: period
          in: query
          description: NFL period sequence through which cumulative returns are calculated.
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: basis
          in: query
          description: Select the snapshot basis used for the focused return view.
          schema:
            type: string
            enum: [realized, mtm]
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of team results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamResultRow"

  /results/by-owner:
    get:
      operationId: getResultsByOwner
      tags: [results]
      summary: Calcutta Returns aggregated by owner for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
        - name: period
          in: query
          description: NFL period sequence through which cumulative returns are calculated.
          schema:
            type: number
            minimum: 0
            maximum: 22
            multipleOf: 1
        - name: basis
          in: query
          description: Select the snapshot basis used for the focused return view.
          schema:
            type: string
            enum: [realized, mtm]
        - name: membershipView
          in: query
          description: Use historical consortium membership at the Calcutta as-of date (default), or the current roster.
          schema:
            type: string
            enum: [historical, current]
      responses:
        "200":
          description: Owner-level result summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerResultRow"

  /results/nfl-standings/preview:
    post:
      operationId: previewNflStandingsImport
      tags: [results]
      summary: Fetch and validate the current NFL standings without writing results
      description: Requires the ADMIN_API_KEY bearer token. The NFL source URL is fixed server-side.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NflStandingsImportInput"
      responses:
        "200":
          description: Validated standings preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NflStandingsImportPreview"
        "4XX":
          description: Source or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: ADMIN_API_KEY bearer token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/nfl-standings/apply:
    post:
      operationId: applyNflStandingsImport
      tags: [results]
      summary: Atomically import the current NFL standings
      description: Requires the ADMIN_API_KEY bearer token. The NFL source URL is fixed server-side.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NflStandingsImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NflStandingsImportResponse"
        "4XX":
          description: Source or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: ADMIN_API_KEY bearer token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/refresh:
    post:
      operationId: refreshNflStandingsJob
      tags: [jobs]
      summary: Trigger a guarded, request-driven NFL standings refresh
      description: Requires the dedicated JOB_RUNNER_SECRET bearer token. The endpoint exits without fetching standings when no NFL game is live or recently final and the stored standings are fresh.
      security:
        - JobRunnerBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NflStandingsRefreshJobInput"
      responses:
        "200":
          description: Completed refresh or an intentional no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NflStandingsRefreshJobResponse"
        "400":
          description: Invalid job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: JOB_RUNNER_SECRET bearer token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Schedule or standings source failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/availability:
    get:
      operationId: getResultsAvailability
      tags: [results]
      summary: Latest recorded reporting periods for a season and basis
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
        - name: basis
          in: query
          description: Snapshot basis used to identify recorded reporting periods.
          schema:
            type: string
            enum: [realized, mtm]
      responses:
        "200":
          description: Most recent and immediately preceding recorded reporting periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsAvailability"

  /results/compare:
    get:
      operationId: getResultsCompare
      tags: [results]
      summary: Compare bidder or consortium returns across selected Calcuttas
      parameters:
        - name: seasons
          in: query
          required: true
          description: Comma-separated NFL season years to compare (two to six selections).
          schema:
            type: string
            example: "2025,2026"
        - name: period
          in: query
          description: NFL period sequence through which cumulative returns are calculated.
          schema:
            type: number
            minimum: 0
            maximum: 22
            multipleOf: 1
        - name: basis
          in: query
          description: Basis used to rank the comparison rows and identify missing snapshots.
          schema:
            type: string
            enum: [realized, mtm]
        - name: groupBy
          in: query
          description: Roll up positions by individual bidder or dated consortium roster.
          schema:
            type: string
            enum: [bidder, consortium]
        - name: membershipView
          in: query
          description: Use historical consortium membership at each Calcutta as-of date (default), or the current roster.
          schema:
            type: string
            enum: [historical, current]
      responses:
        "200":
          description: Cross-Calcutta comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalcuttaComparisonResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/upsert:
    post:
      operationId: upsertTeamResult
      tags: [results]
      summary: Create or update a team result record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamResultInput"
      responses:
        "200":
          description: Upserted team result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResultRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /periods:
    get:
      operationId: getSportPeriods
      tags: [results]
      summary: List shared sport periods
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            default: NFL
      responses:
        "200":
          description: Shared period template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportPeriod"

  /period-snapshots:
    post:
      operationId: upsertTeamPeriodSnapshot
      tags: [results]
      summary: Write one cumulative realized or mark-to-market team snapshot for an NFL period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPeriodSnapshotInput"
      responses:
        "200":
          description: Upserted snapshot and calculated gross return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPeriodSnapshotRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /period-snapshots/week-zero:
    post:
      operationId: initializeWeekZeroPoints
      tags: [results]
      summary: Initialize the immutable zero-stat Week 0 baseline for a season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeWeekZeroPointsInput"
      responses:
        "200":
          description: Week 0 realized and MTM snapshots initialized or already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekZeroPointsInitialization"
        "400":
          description: Validation error or no auctioned teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payout-rules:
    get:
      operationId: getPayoutRules
      tags: [results]
      summary: List a season Calcutta's payout rules
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Payout rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRuleRow"
    put:
      operationId: replacePayoutRules
      tags: [results]
      summary: Replace all payout rules for a season's canonical Calcutta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutRulesUpdate"
      responses:
        "200":
          description: Saved payout rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRuleRow"

  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List trades for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRow"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Submit a trade for commissioner review (open submission; always pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/{id}:
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a pending trade record (price, date, notes; percentage edits require ADMIN_API_KEY)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: ADMIN_API_KEY bearer token required when changing ownership percentage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Approved trades are immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a pending trade record (admin only — requires ADMIN_API_KEY bearer token)
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Approved trades cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/validate:
    get:
      operationId: validateAdminKey
      tags: [trades]
      summary: Validate the commissioner admin bearer token
      security:
        - AdminBearerAuth: []
      responses:
        "204":
          description: Admin token is valid
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/{id}/status:
    patch:
      operationId: setTradeStatus
      tags: [trades]
      summary: Confirm a pending trade decision or void an approved trade (admin only — requires ADMIN_API_KEY bearer token)
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeStatusUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mtm:
    get:
      operationId: getMtmSnapshots
      tags: [mtm]
      summary: Get weekly MTM snapshots for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
        - name: teamId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: MTM snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmData"
    post:
      operationId: upsertMtmSnapshot
      tags: [mtm]
      summary: Add or update a weekly MTM snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MtmSnapshotInput"
      responses:
        "200":
          description: Upserted snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmSnapshot"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target team/date is protected Kalshi Week 0 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mtm/week-zero/capture:
    post:
      operationId: captureWeekZeroMtm
      tags: [mtm]
      summary: Capture an admin-authorized Week 0 valuation from public Kalshi market data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekZeroCaptureInput"
      responses:
        "200":
          description: Captured Week 0 valuation diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekZeroCaptureResult"
        "400":
          description: Validation or incomplete market data error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The selected Week 0 date is already occupied by manual MTM data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Kalshi market data could not be captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary:
    get:
      operationId: getAuctionSummary
      tags: [summary]
      summary: Overall auction summary for a specific season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
          description: Season year (YYYY). Required. Returns empty/zero data if the season has no auction rows.
        - name: calcuttaId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Auction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auction/import:
    post:
      operationId: importAuctionData
      tags: [auction]
      summary: Import a complete season auction export from the configured AuctionPro source
      description: Requires the ADMIN_API_KEY bearer token. The source URL and optional source authorization stay server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionImportInput"
      responses:
        "200":
          description: Imported selected season auction data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionImportResult"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing approved trades make it unsafe to replace primary ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Source export is malformed, incomplete, or cannot be resolved safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Configured AuctionPro source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auction/import/draft-order:
    post:
      operationId: importDraftOrder
      tags: [auction]
      summary: Import auction prices, ownership, and draft order from the AuctionPro live endpoint
      description: >
        Fetches the public AuctionPro draft-order endpoint and atomically replaces the
        season's auction prices, single-owner primary ownership, and draft order in
        team results. Requires the ADMIN_API_KEY bearer token. Blocked if any of the
        32 teams already have approved trades for the target season.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionImportInput"
      responses:
        "200":
          description: Successfully imported draft-order data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionImportResult"
        "401":
          description: Unauthorized — ADMIN_API_KEY required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing approved trades make it unsafe to replace primary ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Source export is malformed, incomplete, or cannot be resolved safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AuctionPro draft-order endpoint is unavailable or returned a non-JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v2/owner/portfolio:
    get:
      operationId: getOwnerPortfolioV2
      tags: [agent]
      summary: Return every current signed position for one owner
      parameters:
        - $ref: "#/components/parameters/AgentOwner"
        - $ref: "#/components/parameters/AgentSeason"
        - $ref: "#/components/parameters/AgentCalcuttaId"
        - $ref: "#/components/parameters/AgentPeriod"
        - $ref: "#/components/parameters/AgentBasis"
      responses:
