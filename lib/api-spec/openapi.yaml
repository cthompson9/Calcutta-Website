        "404":
          $ref: "#/components/responses/AgentError"

  /v2/points-rubric:
    get:
      operationId: getPointsRubricV2
      tags: [agent]
      summary: Return the authoritative selected-Calcutta scoring rubric
      parameters:
        - $ref: "#/components/parameters/AgentSeason"
        - $ref: "#/components/parameters/AgentCalcuttaId"
      responses:
        "200":
          description: Points rubric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPointsRubric"
        "400":
          $ref: "#/components/responses/AgentError"
        "404":
          $ref: "#/components/responses/AgentError"

  /v2/leaderboard/consortia:
    get:
      operationId: getConsortiumLeaderboardV2
      tags: [agent]
      summary: Return a selected-Calcutta consortium leaderboard
      parameters:
        - $ref: "#/components/parameters/AgentSeason"
        - $ref: "#/components/parameters/AgentCalcuttaId"
        - $ref: "#/components/parameters/AgentPeriod"
        - $ref: "#/components/parameters/AgentBasis"
        - name: membershipView
          in: query
          schema:
            type: string
            enum: [historical, current]
            default: historical
      responses:
        "200":
          description: Consortium leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConsortiumLeaderboard"
        "400":
