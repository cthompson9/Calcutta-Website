openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Auction Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: teams
  - name: bidders
  - name: seasons
  - name: results
  - name: trades
  - name: mtm
  - name: summary

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /seasons:
    get:
      operationId: getSeasons
      tags: [seasons]
      summary: List all seasons
      responses:
        "200":
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
    post:
      operationId: createSeason
      tags: [seasons]
      summary: Create a season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "201":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: division
          in: query
          schema:
            type: string
            enum: [East, North, South, West]
        - name: search
          in: query
          schema:
            type: string
        - name: bidderId
          in: query
          schema:
            type: ["number", "null"]
        - name: season
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a single team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bidders:
    get:
      operationId: getBidders
      tags: [bidders]
      summary: List all bidders with totals
      parameters:
        - name: season
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: List of bidders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidderSummary"
    post:
      operationId: createBidder
      tags: [bidders]
      summary: Create a bidder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderInput"
      responses:
        "201":
          description: Created bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bidders/{id}:
    patch:
      operationId: updateBidder
      tags: [bidders]
      summary: Update a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidderUpdate"
      responses:
        "200":
          description: Updated bidder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bidder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBidder
      tags: [bidders]
      summary: Delete a bidder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results:
    get:
      operationId: getResults
      tags: [results]
      summary: Calcutta Returns by team for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: conference
          in: query
          schema:
            type: string
            enum: [AFC, NFC]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of team results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamResultRow"

  /results/by-owner:
    get:
      operationId: getResultsByOwner
      tags: [results]
      summary: Calcutta Returns aggregated by owner for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Owner-level result summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerResultRow"

  /results/upsert:
    post:
      operationId: upsertTeamResult
      tags: [results]
      summary: Create or update a team result record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamResultInput"
      responses:
        "200":
          description: Upserted team result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResultRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List trades for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRow"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Record a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/{id}:
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a trade record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a trade record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mtm:
    get:
      operationId: getMtmSnapshots
      tags: [mtm]
      summary: Get weekly MTM snapshots for a season
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: number
        - name: teamId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: MTM snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmData"
    post:
      operationId: upsertMtmSnapshot
      tags: [mtm]
      summary: Add or update a weekly MTM snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MtmSnapshotInput"
      responses:
        "200":
          description: Upserted snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MtmSnapshot"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary:
    get:
      operationId: getAuctionSummary
      tags: [summary]
      summary: Overall auction summary
      parameters:
        - name: season
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Auction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Season:
      type: object
      properties:
        id:
          type: number
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [id, year, isActive, isComplete, label]

    SeasonInput:
      type: object
      properties:
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [year, label]

    Bidder:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
      required: [id, name]

    BidderSummary:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        teamCount:
          type: number
        totalPaid:
          type: number
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamRef"
      required: [id, name, teamCount, totalPaid, teams]

    TeamRef:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
        division:
          type: string
        bidAmount:
          type: number
        ownershipShare:
          type: number
      required: [id, name, conference, division, bidAmount, ownershipShare]

    BidderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]

    BidderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    Team:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/TeamOwner"
      required: [id, name, conference, division, bidAmount, owners]

    TeamOwner:
      type: object
      properties:
        bidderId:
          type: number
        bidderName:
          type: string
        ownershipShare:
          type: number
      required: [bidderId, bidderName, ownershipShare]

    TeamInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
          minimum: 0
        season:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerInput"
          minItems: 1
      required: [name, conference, division, bidAmount, owners]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
        bidAmount:
          type: number
          minimum: 0
        season:
          type: number
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerInput"
          minItems: 1

    OwnerInput:
      type: object
      properties:
        bidderId:
          type: number
        ownershipShare:
          type: number
      required: [bidderId, ownershipShare]

    # Results (Calcutta Returns format)
    TeamResultRow:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        conference:
          type: string
        division:
          type: string
        owners:
          type: array
          items:
            $ref: "#/components/schemas/TeamOwner"
        cost:
          type: number
        wins:
          type: number
        ptDiff:
          type: number
        startingPoints:
          type: number
        draftOrder:
          type: ["number", "null"]
        playoffBerth:
          type: boolean
        divRound:
          type: boolean
        confRound:
          type: boolean
        sbBerth:
          type: boolean
        winSuperBowl:
          type: boolean
        realizedReturn:
          type: number
        realizedMultiple:
          type: number
        netReturn:
          type: number
        netPctReturn:
          type: number
        markToMarket:
          type: number
      required:
        - teamId
        - teamName
        - conference
        - division
        - owners
        - cost
        - wins
        - ptDiff
        - startingPoints
        - playoffBerth
        - divRound
        - confRound
        - sbBerth
        - winSuperBowl
        - realizedReturn
        - realizedMultiple
        - netReturn
        - netPctReturn
        - markToMarket

    OwnerResultRow:
      type: object
      properties:
        bidderId:
          type: number
        bidderName:
          type: string
        teamCount:
          type: number
        totalCost:
          type: number
        totalRealizedReturn:
          type: number
        totalNetReturn:
          type: number
        netPctReturn:
          type: number
        totalMtm:
          type: number
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamResultRow"
      required:
        - bidderId
        - bidderName
        - teamCount
        - totalCost
        - totalRealizedReturn
        - totalNetReturn
        - netPctReturn
        - totalMtm
        - teams

    TeamResultInput:
      type: object
      properties:
        teamId:
          type: number
        seasonYear:
          type: number
        wins:
          type: number
        ptDiff:
          type: number
        startingPoints:
          type: number
        draftOrder:
          type: ["number", "null"]
        playoffBerth:
          type: boolean
        divRound:
          type: boolean
        confRound:
          type: boolean
        sbBerth:
          type: boolean
        winSuperBowl:
          type: boolean
        realizedReturn:
          type: number
        realizedMultiple:
          type: number
        netReturn:
          type: number
        netPctReturn:
          type: number
        markToMarket:
          type: number
      required: [teamId, seasonYear]

    # Trades
    TradeRow:
      type: object
      properties:
        id:
          type: number
        seasonYear:
          type: number
        teamId:
          type: number
        teamName:
          type: string
        fromBidderId:
          type: number
        fromBidderName:
          type: string
        toBidderId:
          type: number
        toBidderName:
          type: string
        price:
          type: number
        tradeDate:
          type: string
        notes:
          type: ["string", "null"]
      required:
        - id
        - seasonYear
        - teamId
        - teamName
        - fromBidderId
        - fromBidderName
        - toBidderId
        - toBidderName
        - price
        - tradeDate

    TradeInput:
      type: object
      properties:
        seasonYear:
          type: number
        teamId:
          type: number
        fromBidderId:
          type: number
        toBidderId:
          type: number
        price:
          type: number
        tradeDate:
          type: string
        notes:
          type: string
      required: [seasonYear, teamId, fromBidderId, toBidderId, price, tradeDate]

    TradeUpdate:
      type: object
      properties:
        price:
          type: number
        tradeDate:
          type: string
        notes:
          type: string

    # MTM
    MtmSnapshot:
      type: object
      properties:
        id:
          type: number
        teamId:
          type: number
        seasonId:
          type: number
        weekNum:
          type: number
        snapshotDate:
          type: ["string", "null"]
        mtmValue:
          type: number
      required: [id, teamId, seasonId, weekNum, mtmValue]

    MtmWeekData:
      type: object
      properties:
        weekNum:
          type: number
        snapshotDate:
          type: ["string", "null"]
        ownerTotals:
          type: array
          items:
            $ref: "#/components/schemas/MtmOwnerWeek"
        teamValues:
          type: array
          items:
            $ref: "#/components/schemas/MtmTeamWeek"
      required: [weekNum, ownerTotals, teamValues]

    MtmOwnerWeek:
      type: object
      properties:
        bidderName:
          type: string
        mtmTotal:
          type: number
      required: [bidderName, mtmTotal]

    MtmTeamWeek:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        ownerName:
          type: string
        mtmValue:
          type: number
      required: [teamId, teamName, ownerName, mtmValue]

    MtmData:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/MtmWeekData"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/MtmTeamSeries"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/MtmOwnerSeries"
      required: [weeks, teams, owners]

    MtmTeamSeries:
      type: object
      properties:
        teamId:
          type: number
        teamName:
          type: string
        conference:
          type: string
        ownerName:
          type: string
        weeklyValues:
          type: array
          items:
            type: number
      required: [teamId, teamName, conference, ownerName, weeklyValues]

    MtmOwnerSeries:
      type: object
      properties:
        bidderName:
          type: string
        weeklyTotals:
          type: array
          items:
            type: number
      required: [bidderName, weeklyTotals]

    MtmSnapshotInput:
      type: object
      properties:
        teamId:
          type: number
        seasonYear:
          type: number
        weekNum:
          type: number
        snapshotDate:
          type: string
        mtmValue:
          type: number
      required: [teamId, seasonYear, weekNum, mtmValue]

    # Summary
    AuctionSummary:
      type: object
      properties:
        potSize:
          type: number
        teamsAuctioned:
          type: number
        nominationsLeft:
          type: number
        avgBidPerTeam:
          type: number
        standings:
          type: array
          items:
            $ref: "#/components/schemas/BidderStanding"
        conferenceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ConferenceBreakdown"
      required:
        - potSize
        - teamsAuctioned
        - nominationsLeft
        - avgBidPerTeam
        - standings
        - conferenceBreakdown

    BidderStanding:
      type: object
      properties:
        bidderId:
          type: number
        bidderName:
          type: string
        totalPaid:
          type: number
        teamCount:
          type: number
        percentOfPot:
          type: number
      required: [bidderId, bidderName, totalPaid, teamCount, percentOfPot]

    ConferenceBreakdown:
      type: object
      properties:
        conference:
          type: string
        totalSpent:
          type: number
        teamCount:
          type: number
        avgBid:
          type: number
      required: [conference, totalSpent, teamCount, avgBid]
