        "404":
          $ref: "#/components/responses/AgentError"

components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Administrative bearer token supplied through ADMIN_API_KEY.
    JobRunnerBearerAuth:
      type: http
      scheme: bearer
      description: Restricted job trigger token supplied through JOB_RUNNER_SECRET.
  responses:
    AgentError:
      description: Invalid or unresolved agent request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    AgentOwner:
      name: owner
      in: query
      required: true
      description: Exact or unambiguous partial registered owner name.
      schema: { type: string }
    AgentSeason:
      name: season
      in: query
      required: true
      schema: { type: number }
    AgentCalcuttaId:
      name: calcuttaId
      in: query
      description: Defaults to the season's canonical NFL Calcutta.
      schema: { type: number }
    AgentPeriod:
      name: period
      in: query
      schema: { type: number, minimum: 0, maximum: 22 }
    AgentBasis:
      name: basis
      in: query
      schema: { type: string, enum: [realized, mtm], default: realized }
    AgentTeam:
      name: team
      in: query
      description: NFL abbreviation, exact name, or unambiguous partial name.
      schema: { type: string }
    AgentTeamRequired:
      name: team
      in: query
      required: true
      description: NFL abbreviation, exact name, or unambiguous partial name.
      schema: { type: string }
    AgentWeek:
      name: week
      in: query
      schema: { type: number, minimum: 0, maximum: 22 }
    AgentDateFrom:
      name: date_from
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    AgentDateTo:
      name: date_to
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    AgentIncludeMarket:
      name: include_market
      in: query
      schema: { type: boolean, default: false }
    AgentIncludeProjection:
      name: include_projection
      in: query
      schema: { type: boolean, default: false }
  schemas:
    AgentPortfolioTeam:
      type: object
      required: [team_id, team, abbreviation, ownership_percentage, original_ownership_percentage, cost_basis, trade_paid, trade_received, current_mtm, realized_return, net_mtm, net_return, value_source, wins, losses, ties, point_differential, playoff_status, playoff_seed]
      properties:
        team_id: { type: number }
        team: { type: string }
        abbreviation: { type: ["string", "null"] }
        ownership_percentage: { type: number }
        original_ownership_percentage: { type: number }
        cost_basis: { type: number }
        trade_paid: { type: number }
        trade_received: { type: number }
        current_mtm: { type: ["number", "null"] }
        realized_return: { type: ["number", "null"] }
        net_mtm: { type: ["number", "null"] }
        net_return: { type: ["number", "null"] }
        value_source: { type: string, enum: [calculated, legacy, unavailable] }
        wins: { type: ["number", "null"] }
        losses: { type: ["number", "null"] }
        ties: { type: ["number", "null"] }
        point_differential: { type: ["number", "null"] }
        playoff_status: { type: ["string", "null"] }
        playoff_seed: { type: ["number", "null"] }
    AgentOwnerPortfolio:
      type: object
      required: [owner, season, calcutta_id, basis, through_period, total_cost, current_mtm, realized_return, total_return, roi, calculation_status, teams]
      properties:
        owner: { type: string }
        season: { type: number }
        calcutta_id: { type: number }
        basis: { type: string, enum: [realized, mtm] }
        through_period: { type: ["number", "null"] }
        total_cost: { type: number }
        current_mtm: { type: ["number", "null"] }
        realized_return: { type: ["number", "null"] }
        total_return: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
        calculation_status: { type: string, enum: [calculated, legacy, mixed, unavailable] }
        teams:
          type: array
          items: { $ref: "#/components/schemas/AgentPortfolioTeam" }
    AgentOwnerSummary:
      type: object
      required: [owner, season, calcutta_id, team_count, total_cost, current_mtm, realized_return, total_return, roi, basis, through_period, calculation_status]
      properties:
        owner: { type: string }
        season: { type: number }
        calcutta_id: { type: number }
        team_count: { type: number }
        total_cost: { type: number }
        current_mtm: { type: ["number", "null"] }
        realized_return: { type: ["number", "null"] }
        total_return: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
        basis: { type: string, enum: [realized, mtm] }
        through_period: { type: ["number", "null"] }
        calculation_status: { type: string, enum: [calculated, legacy, mixed, unavailable] }
    AgentOwnerPerformance:
      type: object
      required: [owner, season, calcutta_id, basis, through_period, teams, calculation_status]
      properties:
        owner: { type: string }
        season: { type: number }
        calcutta_id: { type: number }
        basis: { type: string, enum: [realized, mtm] }
        through_period: { type: ["number", "null"] }
        calculation_status: { type: string, enum: [calculated, legacy, mixed, unavailable] }
        teams:
          type: array
          items: { $ref: "#/components/schemas/AgentPortfolioTeam" }
    AgentMarket:
      type: ["object", "null"]
      required: [snapshot_at, source, spread, home_moneyline, away_moneyline, home_implied_probability, away_implied_probability, total]
      properties:
        snapshot_at: { type: string, format: date-time }
        source: { type: string }
        spread: { type: ["number", "null"] }
        home_moneyline: { type: ["number", "null"] }
        away_moneyline: { type: ["number", "null"] }
        home_implied_probability: { type: ["number", "null"] }
        away_implied_probability: { type: ["number", "null"] }
        total: { type: ["number", "null"] }
    AgentProjection:
      type: ["object", "null"]
      required: [snapshot_at, source, model_name, home_win_probability, away_win_probability, projected_home_score, projected_away_score, projected_point_differential]
      properties:
        snapshot_at: { type: string, format: date-time }
        source: { type: string }
        model_name: { type: string }
        home_win_probability: { type: ["number", "null"] }
        away_win_probability: { type: ["number", "null"] }
        projected_home_score: { type: ["number", "null"] }
        projected_away_score: { type: ["number", "null"] }
        projected_point_differential: { type: ["number", "null"] }
    AgentGame:
      type: object
      required: [game_id, source_game_id, database_id, week, date, kickoff_at, timezone, away_team, away_abbreviation, home_team, home_abbreviation, venue, network, status, away_score, home_score, is_marquee, point_diff_multiplier, source, updated_at, market, projection]
      properties:
        game_id: { type: string }
        source_game_id: { type: string }
        database_id: { type: number }
        week: { type: number }
        date: { type: string, format: date }
        kickoff_at: { type: ["string", "null"] }
        timezone: { type: string }
        away_team: { type: string }
        away_abbreviation: { type: ["string", "null"] }
        home_team: { type: string }
        home_abbreviation: { type: ["string", "null"] }
        venue: { type: ["string", "null"] }
        network: { type: ["string", "null"] }
        status: { type: string }
        away_score: { type: ["number", "null"] }
        home_score: { type: ["number", "null"] }
        is_marquee: { type: ["boolean", "null"] }
        point_diff_multiplier: { type: ["number", "null"] }
        source: { type: string }
        updated_at: { type: string, format: date-time }
        market: { $ref: "#/components/schemas/AgentMarket" }
        projection: { $ref: "#/components/schemas/AgentProjection" }
    AgentSchedule:
      type: object
      required: [season, calcutta_id, games]
      properties:
        season: { type: number }
        calcutta_id: { type: number }
        games:
          type: array
          items: { $ref: "#/components/schemas/AgentGame" }
    AgentTeamScheduleGame:
      allOf:
        - $ref: "#/components/schemas/AgentGame"
        - type: object
          required: [opponent, home_away, current_calcutta_value, projected_ev_impact]
          properties:
            opponent: { type: string }
            home_away: { type: string, enum: [home, away] }
            current_calcutta_value: { type: ["number", "null"] }
            projected_ev_impact: { type: ["number", "null"] }
    AgentTeamSchedule:
      type: object
      required: [season, calcutta_id, team, games, ownership, record]
      properties:
        season: { type: number }
        calcutta_id: { type: number }
        team: { type: string }
        games:
          type: array
          items: { $ref: "#/components/schemas/AgentTeamScheduleGame" }
        ownership:
          type: array
          items:
            type: object
            additionalProperties: true
        record:
          type: ["object", "null"]
          additionalProperties: true
    AgentGameDetail:
      type: object
      required: [game, market, projection, calcutta]
      properties:
        game: { $ref: "#/components/schemas/AgentGame" }
        market: { $ref: "#/components/schemas/AgentMarket" }
        projection: { $ref: "#/components/schemas/AgentProjection" }
        calcutta:
          type: object
          additionalProperties: true
    AgentPointsRule:
      type: object
      required: [rule_name, metric, value, unit, multiplier, description]
      properties:
        rule_name: { type: string }
        metric: { type: string }
        value: { type: ["number", "null"] }
        unit: { type: string }
        multiplier: { type: ["number", "null"] }
        description: { type: string }
    AgentPointsRubric:
      type: object
      required: [season, calcutta_id, starting_points, rules]
      properties:
        season: { type: number }
        calcutta_id: { type: number }
        starting_points: { type: number }
        rules:
          type: array
          items: { $ref: "#/components/schemas/AgentPointsRule" }
    AgentConsortiumLeaderboardRow:
      type: object
      required: [rank, consortium, owner_count, total_cost, realized_return, current_mtm, net_return, net_mtm, roi]
      properties:
        rank: { type: number }
        consortium: { type: string }
        owner_count: { type: number }
        total_cost: { type: number }
        realized_return: { type: ["number", "null"] }
        current_mtm: { type: ["number", "null"] }
        net_return: { type: ["number", "null"] }
        net_mtm: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
    AgentConsortiumLeaderboard:
      type: object
      required: [season, calcutta_id, basis, through_period, membership_view, rows]
      properties:
        season: { type: number }
        calcutta_id: { type: number }
        basis: { type: string, enum: [realized, mtm] }
        through_period: { type: ["number", "null"] }
        membership_view: { type: string, enum: [historical, current] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AgentConsortiumLeaderboardRow" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    NflStandingsRefreshJobInput:
      type: object
      additionalProperties: false
      properties:
        job:
          type: string
          enum: [standings]
          default: standings
        force:
          type: boolean
          default: false

    NflStandingsRefreshJobResponse:
      type: object
      properties:
        job:
          type: string
          enum: [standings]
        ran:
          type: boolean
        reason:
          type: string
          enum: [no-games-live, already-running, already-current]
        teamsUpdated:
          type: number
        durationMs:
          type: number
      required: [job, ran, durationMs]

    Season:
      type: object
      properties:
        id:
          type: number
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [id, year, isActive, isComplete, label]

    SeasonInput:
      type: object
      properties:
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        label:
          type: string
      required: [year, label]

    CalcuttaOption:
      type: object
      properties:
        id:
          type: number
        seasonId:
          type: number
        name:
          type: string
        sport:
          type: string
        year:
          type: number
        isActive:
          type: boolean
        isComplete:
          type: boolean
        isCanonical:
          type: boolean
      required: [id, seasonId, name, sport, year, isActive, isComplete, isCanonical]

    Bidder:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        consortium:
          type: ["string", "null"]
          description: Consortium assigned to this bidder, if any.
      required: [id, name, consortium]

    BidderSummary:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        consortium:
          type: ["string", "null"]
          description: Consortium assigned to this bidder, if any.
        teamCount:
          type: number
        totalPaid:
          type: number
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamRef"
      required: [id, name, consortium, teamCount, totalPaid, teams]

    TeamRef:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
        division:
          type: string
        bidAmount:
          type: number
        ownershipShare:
          type: number
      required: [id, name, conference, division, bidAmount, ownershipShare]

    BidderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        calcuttaId:
          type: number
      required: [name]

    BidderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        calcuttaId:
          type: number

    Team:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        conference:
          type: string
          enum: [AFC, NFC]
        division:
          type: string
          enum: [East, North, South, West]
