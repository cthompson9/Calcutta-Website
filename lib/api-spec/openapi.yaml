    # Trades
    TradeRow:
      type: object
      properties:
        id:
          type: number
        seasonYear:
          type: number
        teamId:
          type: number
        teamName:
          type: string
        fromBidderId:
          type: number
        fromBidderName:
          type: string
        toBidderId:
          type: number
        toBidderName:
          type: string
        price:
          type: number
        percentage:
          type: number
          description: Percentage of team traded (0–100). Default 100 = full transfer.
        status:
          type: string
          enum: [pending, approved, rejected, voided]
          description: Approval status. New trades start as pending; an approved trade may later be voided.
        decisionAt:
          type: ["string", "null"]
          format: date-time
          description: Time the commissioner decision was recorded. Null for pending or legacy records.
        decisionSource:
          type: ["string", "null"]
          description: Trusted channel that recorded the decision. Null for pending or legacy records.
        voidedAt:
          type: ["string", "null"]
          format: date-time
          description: Time the approved trade was voided. Null unless the trade is voided.
        voidedSource:
          type: ["string", "null"]
          description: Trusted channel that recorded the void. Null unless the trade is voided.
        voidReason:
          type: ["string", "null"]
          description: Required commissioner explanation when the trade is voided.
        tradeDate:
          type: string
        notes:
          type: ["string", "null"]
      required:
        - id
        - seasonYear
        - teamId
        - teamName
        - fromBidderId
        - fromBidderName
        - toBidderId
        - toBidderName
        - price
        - percentage
        - status
        - decisionAt
        - decisionSource
        - voidedAt
        - voidedSource
        - voidReason
        - tradeDate

