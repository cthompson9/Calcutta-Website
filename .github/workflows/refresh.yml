name: Calcutta refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport scope for a manual results refresh"
        default: "NFL"
        type: choice
        options:
          - NFL
          - CFB
          - both

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Determine job type
        id: job
        env:
          REQUESTED_SPORT: ${{ inputs.sport }}
        run: |
          echo "name=standings" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$REQUESTED_SPORT" in
              NFL|CFB|both) echo "sport=$REQUESTED_SPORT" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unsupported sport" >&2; exit 1 ;;
            esac
          else
            echo "sport=NFL" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger refresh
        env:
          REFRESH_JOB: ${{ steps.job.outputs.name }}
          REFRESH_SPORT: ${{ steps.job.outputs.sport }}
          CALCUTTA_APP_URL: ${{ secrets.CALCUTTA_APP_URL }}
          CALCUTTA_JOB_SECRET: ${{ secrets.CALCUTTA_JOB_SECRET }}
        run: |
          trigger_refresh() {
            case "$1" in
              NFL) competition="NFL_REGULAR_SEASON" ;;
              CFB) competition="CFB_REGULAR_SEASON" ;;
              *) echo "Unsupported sport" >&2; return 1 ;;
            esac
            curl -fsS --max-time 120 --retry 2 --retry-delay 10 \
              -X POST "$CALCUTTA_APP_URL/api/jobs/refresh" \
              -H "Authorization: Bearer $CALCUTTA_JOB_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"job\":\"$REFRESH_JOB\",\"sport\":\"$1\",\"competition\":\"$competition\"}"
          }

          if [ "$REFRESH_SPORT" = "both" ]; then
            trigger_refresh NFL &
            nfl_pid=$!
            trigger_refresh CFB &
            cfb_pid=$!
            wait "$nfl_pid"
            wait "$cfb_pid"
          else
            trigger_refresh "$REFRESH_SPORT"
          fi
