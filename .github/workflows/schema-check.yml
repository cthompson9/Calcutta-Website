name: Schema convergence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject a stale schema baseline
        run: |
          baseline_date="$(
            sed -nE \
              's/^-- Calcutta production schema baseline captured ([0-9]{4}-[0-9]{2}-[0-9]{2}) UTC.*/\1/p' \
              reference/schema-baseline.sql |
              head -n 1
          )"
          test -n "$baseline_date" || {
            echo "::error::reference/schema-baseline.sql is missing its capture date header" >&2
            exit 1
          }

          baseline_epoch="$(date -u -d "$baseline_date" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - baseline_epoch))
          if [ "$age_seconds" -gt $((90 * 24 * 60 * 60)) ]; then
            age_days=$((age_seconds / 86400))
            echo "::error::reference/schema-baseline.sql is $age_days days old; regenerate it in the same PR as the schema change." >&2
            exit 1
          fi
          echo "Schema baseline captured $baseline_date (${age_seconds} seconds old)."

      - name: Load schema baseline
        run: |
          psql -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

          # pg_dump includes CREATE SCHEMA public, while the service database
          # already has that standard schema. Keep the committed file unchanged
          # and omit only those duplicate schema statements in the load copy.
          sed \
            -e '/^CREATE SCHEMA public;$/d' \
            -e "/^COMMENT ON SCHEMA public IS 'standard public schema';$/d" \
            reference/schema-baseline.sql \
            > "$RUNNER_TEMP/schema-baseline.sql"
          psql -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" \
            --file="$RUNNER_TEMP/schema-baseline.sql"

      - name: Assert drizzle-kit push emits no DDL
        run: |
          push_log="$RUNNER_TEMP/drizzle-push.log"
          set +e
          CI=true pnpm --filter @workspace/db exec drizzle-kit push \
            --config ./drizzle.config.ts \
            --verbose >"$push_log" 2>&1
          push_status=$?
          set -e

          cat "$push_log"
          if [ "$push_status" -ne 0 ]; then
            echo "::error::drizzle-kit push failed; schema convergence is not clean." >&2
            exit "$push_status"
          fi

          if grep -Eni \
            '(^|[[:space:]])(alter|create|drop|truncate|rename|grant|revoke)[[:space:]]' \
            "$push_log"; then
            echo "::error::drizzle-kit push emitted DDL against the committed schema baseline." >&2
            exit 1
          fi

          echo "Schema baseline converges with no emitted DDL."