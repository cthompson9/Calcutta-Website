name: Nightly database backup

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_REPOSITORY: cthompson9/Calcutta-Backups
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt \
            $(. /etc/os-release && printf '%s' "$VERSION_CODENAME")-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16

          pg_dump_version="$(pg_dump --version)"
          case "$pg_dump_version" in
            "pg_dump (PostgreSQL) 16."*) ;;
            *)
              echo "Expected PostgreSQL 16.x client, got: $pg_dump_version" >&2
              exit 1
              ;;
          esac
          echo "$pg_dump_version"

      - name: Check out backup repository
        uses: actions/checkout@v4
        with:
          repository: cthompson9/Calcutta-Backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repository
          persist-credentials: true

      - name: Create backup artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          test -n "$BACKUP_DATABASE_URL" || {
            echo "BACKUP_DATABASE_URL is required and must point to the production read-only role" >&2
            exit 1
          }
          test -n "$BACKUP_REPO_TOKEN" || {
            echo "BACKUP_REPO_TOKEN is required" >&2
            exit 1
          }

          backup_date="$(date -u +%F)"
          work_directory="$RUNNER_TEMP/calcutta-backup/$backup_date"
          mkdir -p "$work_directory"
          echo "backup_date=$backup_date" >> "$GITHUB_OUTPUT"
          echo "work_directory=$work_directory" >> "$GITHUB_OUTPUT"

          snapshot_path="$work_directory/snapshot-$backup_date.json"
          schema_path="$work_directory/schema-$backup_date.sql"
          dump_path="$work_directory/dump-$backup_date.sql.gz"

          pnpm --filter @workspace/db run export-snapshot -- "$snapshot_path"
          test -s "$snapshot_path"

          pg_dump \
            --dbname="$BACKUP_DATABASE_URL" \
            --schema-only \
            --no-owner \
            --no-privileges \
            > "$schema_path"
          test -s "$schema_path"

          pg_dump \
            --dbname="$BACKUP_DATABASE_URL" |
            gzip --stdout > "$dump_path"
          test -s "$dump_path"

          echo "snapshot_path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "schema_path=$schema_path" >> "$GITHUB_OUTPUT"
          echo "dump_path=$dump_path" >> "$GITHUB_OUTPUT"

      - name: Report snapshot byte sizes
        env:
          SNAPSHOT_PATH: ${{ steps.artifacts.outputs.snapshot_path }}
        run: |
          total_bytes="$(jq '[.meta.serializedByteSizes[]] | add' "$SNAPSHOT_PATH")"
          event_bytes="$(jq '.meta.serializedByteSizes.event_market_snapshots // 0' "$SNAPSHOT_PATH")"
          echo "Snapshot serialized byte sizes, largest first:"
          jq -r '
            .meta.serializedByteSizes
            | to_entries
            | sort_by(.value)
            | reverse
            | .[]
            | "  \(.key): \(.value) bytes"
          ' "$SNAPSHOT_PATH"
          echo "Total serialized table bytes: $total_bytes"

          if [ "$event_bytes" -gt 0 ] && [ "$((event_bytes * 2))" -gt "$total_bytes" ]; then
            echo "::error::event_market_snapshots is more than half of the serialized snapshot bytes."
            echo "Move event-market snapshots to a separate weekly cadence before continuing."
            exit 1
          fi


      - name: Commit logical snapshot and schema
        id: commit
        env:
          BACKUP_DATE: ${{ steps.artifacts.outputs.backup_date }}
          SNAPSHOT_PATH: ${{ steps.artifacts.outputs.snapshot_path }}
          SCHEMA_PATH: ${{ steps.artifacts.outputs.schema_path }}
        working-directory: backup-repository
        run: |
          test -z "$(git status --porcelain)" || {
            echo "Backup repository is not clean; refusing to mix unrelated changes into a backup commit" >&2
            exit 1
          }

          mkdir -p snapshots schema
          cp "$SNAPSHOT_PATH" "snapshots/snapshot-$BACKUP_DATE.json"
          cp "$SCHEMA_PATH" "schema/schema-$BACKUP_DATE.sql"

          git add -- "snapshots/snapshot-$BACKUP_DATE.json" "schema/schema-$BACKUP_DATE.sql"
          if git diff --cached --quiet -- \
            "snapshots/snapshot-$BACKUP_DATE.json" \
            "schema/schema-$BACKUP_DATE.sql"; then
            git reset -- \
              "snapshots/snapshot-$BACKUP_DATE.json" \
              "schema/schema-$BACKUP_DATE.sql"
            echo "No logical snapshot or schema changes; skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          total_rows="$(jq '[.meta.rowCounts[]] | add' "$SNAPSHOT_PATH")"
          table_count="$(jq '.meta.rowCounts | length' "$SNAPSHOT_PATH")"
          git config user.name "calcutta-backup-bot"
          git config user.email "calcutta-backup-bot@users.noreply.github.com"
          git commit -m "snapshot $BACKUP_DATE — $total_rows rows across $table_count tables"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Publish compressed dump release
        env:
          BACKUP_DATE: ${{ steps.artifacts.outputs.backup_date }}
          DUMP_PATH: ${{ steps.artifacts.outputs.dump_path }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          release_tag="backup-$BACKUP_DATE"
          release_title="Database backup $BACKUP_DATE"
          release_notes="Automated PostgreSQL dump for $BACKUP_DATE UTC."

          if gh release view "$release_tag" --repo "$BACKUP_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$DUMP_PATH" \
              --repo "$BACKUP_REPOSITORY" \
              --clobber
            echo "Updated existing release $release_tag."
          else
            gh release create "$release_tag" "$DUMP_PATH" \
              --repo "$BACKUP_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes"
            echo "Created release $release_tag."
          fi